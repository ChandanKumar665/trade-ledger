<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Ledger Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #f4f7fb
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #0d6efd, #6f42c1)
        }

        .sidebar .nav-link {
            color: #fff;
            opacity: .9
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, .15);
            border-radius: 10px
        }

        .card {
            border: none;
            border-radius: 18px
        }

        .stat {
            font-size: 2rem;
            font-weight: 700
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-lg-2 sidebar p-4">
                <h3 class="text-white mb-4"><i class="bi bi-graph-up-arrow"></i> Trade Ledger</h3>
                <div class="nav flex-column gap-2">
                    <a class="nav-link active" href="#"><i class="bi bi-grid"></i> Dashboard</a>
                    <a class="nav-link" href="#"><i class="bi bi-wallet2"></i> Accounts</a>
                    <a class="nav-link" href="#"><i class="bi bi-bar-chart"></i> Trades</a>
                    <a class="nav-link" href="#"><i class="bi bi-pie-chart"></i> Analytics</a>
                    <a class="nav-link" href="#"><i class="bi bi-person"></i> Profile</a>
                </div>
            </nav>
            <main class="col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Dashboard</h2>
                    <div class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add Trade</div>
                </div>
                <div class="row g-3">
                    <div class="col-md-3">
                        <div class="card p-3">
                            <div>Total P&L</div>
                            <div class="stat text-success">₹45,860</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3">
                            <div>Win Rate</div>
                            <div class="stat text-primary">72%</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3">
                            <div>Risk/Reward</div>
                            <div class="stat">1:3.6</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3">
                            <div>Total Trades</div>
                            <div class="stat">245</div>
                        </div>
                    </div>
                </div>
                <div class="row g-4 mt-2">
                    <div class="col-lg-8">
                        <div class="card p-3">
                            <h5>Equity Curve</h5><canvas id="line"></canvas>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card p-3">
                            <h5>Win vs Loss</h5><canvas id="pie"></canvas>
                        </div>
                    </div>
                </div>
                <div class="card mt-4 p-3">
                    <h5>Recent Trades</h5>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>P&L</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>22 Jul</td>
                                <td>BTCUSD</td>
                                <td>Long</td>
                                <td class="text-success">+₹8,500</td>
                            </tr>
                            <tr>
                                <td>21 Jul</td>
                                <td>ETHUSD</td>
                                <td>Short</td>
                                <td class="text-danger">-₹1,200</td>
                            </tr>
                            <tr>
                                <td>20 Jul</td>
                                <td>NIFTY</td>
                                <td>Long</td>
                                <td class="text-success">+₹5,400</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script>
        new Chart(document.getElementById('line'), {
            type: 'line',
            data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], datasets: [{ label: 'Equity', data: [10, 18, 15, 28, 35, 46], borderColor: '#0d6efd', tension: .4 }] }
        });
        new Chart(document.getElementById('pie'), {
            type: 'doughnut',
            data: { labels: ['Win', 'Loss'], datasets: [{ data: [72, 28], backgroundColor: ['#198754', '#dc3545'] }] }
        });
    </script>
</body>

</html>
